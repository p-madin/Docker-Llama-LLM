services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      #not sure this helped
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
      - TEST_MODEL=${TEST_MODEL:-llama3.2}
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
      - ./Modelfile:/Modelfile
      - ./entrypoint.sh:/root/entrypoint.sh
      - ./.env:/root/.env:ro
    entrypoint: ["/usr/bin/bash", "/root/entrypoint.sh"]
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]